name: Build Tetris

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgl1-mesa-dev libxrandr-dev libxi-dev libudev-dev libflac-dev libogg-dev libvorbis-dev libopenal-dev zip wget

      - name: Download SFML 3.1.0 Linux SDK
        run: |
          wget https://www.sfml-dev.org/files/SFML-3.1.0-linux-gcc-64-bit.tar.gz
          tar -xzf SFML-3.1.0-linux-gcc-64-bit.tar.gz

      - name: Compile Game
        run: |
          g++ -c src/main.cpp -I./SFML-3.1.0/include
          g++ main.o -o tetris \
            -L./SFML-3.1.0/lib \
            -L/usr/lib/x86_64-linux-gnu \
            -Wl,-rpath,'$ORIGIN/lib' \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio \
            -lFLAC -logg -lvorbis -lvorbisenc -lvorbisfile -lopenal

      - name: Package Linux Release
        run: |
          mkdir -p tetris-linux
          cp tetris tetris-linux/
          cp -r assets/ tetris-linux/
          cp -r SFML-3.1.0/lib tetris-linux/
          zip -r tetris-linux.zip tetris-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-ubuntu-release
          path: tetris-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt64-toolchain unzip zip

      - name: Download and Extract SFML Windows SDK
        shell: msys2 {0}
        run: |
          curl -L -o sfml.zip https://www.sfml-dev.org/files/SFML-3.1.0-windows-gcc-64-bit.zip
          unzip -q sfml.zip

      - name: Compile Windows Executable
        shell: msys2 {0}
        run: |
          g++ -c src/main.cpp -I./SFML-3.1.0/include
          g++ main.o -o tetris.exe \
            -L./SFML-3.1.0/lib \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio

      - name: Package Windows Release
        shell: msys2 {0}
        run: |
          mkdir -p tetris-win
          cp tetris.exe tetris-win/
          cp -r assets/ tetris-win/
          cp SFML-3.1.0/bin/*.dll tetris-win/
          cd tetris-win && zip -r ../tetris-windows.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-windows-release
          path: tetris-windows.zip