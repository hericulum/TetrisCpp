name: Build Tetris

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & SFML via Apt
        run: |
          sudo apt update
          sudo apt install -y libsfml-dev libflac-dev libogg-dev libvorbis-dev libopenal-dev zip g++ make

      - name: Compile Game
        run: |
          g++ -c src/main.cpp
          g++ main.o -o tetris \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio \
            -lFLAC -logg -lvorbis -lvorbisenc -lvorbisfile -lopenal

      - name: Package Linux Release
        run: |
          mkdir -p tetris-linux
          cp tetris tetris-linux/
          cp -r assets/ tetris-linux/
          zip -r tetris-linux.zip tetris-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-ubuntu-release
          path: tetris-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Install Windows SFML Package
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-SFML unzip zip

      - name: Compile Windows Executable
        shell: msys2 {0}
        run: |
          g++ -c src/main.cpp
          g++ main.o -o tetris.exe \
            -lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio

      - name: Package Windows Release
        shell: msys2 {0}
        run: |
          mkdir -p tetris-win
          cp tetris.exe tetris-win/
          cp -r assets/ tetris-win/
          
          # Automatically find and copy all required SFML and dependency DLLs from MSYS2 environment
          cp /mingw64/bin/sfml-graphics-*.dll tetris-win/ || true
          cp /mingw64/bin/sfml-window-*.dll tetris-win/ || true
          cp /mingw64/bin/sfml-system-*.dll tetris-win/ || true
          cp /mingw64/bin/sfml-audio-*.dll tetris-win/ || true
          cp /mingw64/bin/libopenal-*.dll tetris-win/ || true
          cp /mingw64/bin/libFLAC-*.dll tetris-win/ || true
          cp /mingw64/bin/libogg-*.dll tetris-win/ || true
          cp /mingw64/bin/libvorbis-*.dll tetris-win/ || true
          cp /mingw64/bin/libvorbisfile-*.dll tetris-win/ || true
          cp /mingw64/bin/libvorbisenc-*.dll tetris-win/ || true
          cp /mingw64/bin/libwinpthread-*.dll tetris-win/ || true
          cp /mingw64/bin/libstdc++-*.dll tetris-win/ || true
          cp /mingw64/bin/libgcc_s_seh-*.dll tetris-win/ || true

          cd tetris-win && zip -r ../tetris-windows.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-windows-release
          path: tetris-windows.zip